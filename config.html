<!DOCTYPE html>
<html>
<head>
  <title>Pebble Roon Remote Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0f0f0;
      color: #333;
      margin: 0;
      padding: 0;
    }
    .header {
      background-color: #222;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    h2 { margin: 0; font-size: 20px; font-weight: 500; }
    .container { padding: 20px; }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .item { margin-bottom: 15px; }
    .item:last-child { margin-bottom: 0; }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 14px;
      color: #555;
    }
    input[type="text"], select {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      background-color: #fafafa;
    }
    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: #FF4700;
      background-color: #fff;
    }
    button {
      width: 100%;
      padding: 16px;
      background-color: #FF4700;
      color: white;
      border: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(255, 71, 0, 0.3);
    }
    button:active { background-color: #e64000; }
    .help-text { font-size: 12px; color: #888; margin-top: 5px; }
  </style>
</head>
<body>

  <div class="header">
    <h2>Roon Remote Settings</h2>
  </div>

  <div class="container">

    <div class="card">
      <div class="item">
        <label>Bridge IP Address</label>
        <input type="text" id="ip" placeholder="e.g. 192.168.1.50">
      </div>
      <div class="item">
        <label>Bridge Port</label>
        <input type="text" id="port" placeholder="e.g. 3000">
      </div>
    </div>

    <div class="card">
      <div class="item">
        <label>App Inactivity Timeout</label>
        <select id="timeout_app">
          <option value="0">Infinite (Never close)</option>
          <option value="5">5 Minutes</option>
          <option value="15">15 Minutes</option>
          <option value="30">30 Minutes</option>
          <option value="60">1 Hour</option>
        </select>
        <div class="help-text">Closes the app automatically if no buttons are pressed.</div>
      </div>
      <div class="item">
        <label>Disconnect Timeout</label>
        <select id="timeout_disc">
          <option value="0">Infinite (Never close)</option>
          <option value="1">1 Minute</option>
          <option value="5">5 Minutes</option>
          <option value="15">15 Minutes</option>
          <option value="30">30 Minutes</option>
        </select>
        <div class="help-text">Closes the app if the Bridge connection or Bluetooth drops.</div>
      </div>
    </div>

    <div class="card">
      <div class="item">
        <label>Font Size</label>
        <select id="font_size">
          <option value="0">Small</option>
          <option value="1">Normal</option>
          <option value="2">Large</option>
        </select>
      </div>
      <div class="item">
        <label>Scroll Long Track Names</label>
        <select id="scroll_text">
          <option value="0">Disabled (Truncate)</option>
          <option value="1">Enabled (Marquee)</option>
        </select>
      </div>
    </div>

    <div class="card" id="updown_card" style="display: none;">
      <div class="item">
        <label>Up/Down Buttons Control:</label>
        <select id="updown_vol">
          <option value="0">Change Tracks (Skip/Prev)</option>
          <option value="1">Adjust Volume</option>
        </select>
        <div class="help-text">If set to Volume, Track screen will skip the Volume menu.</div>
      </div>
    </div>

    <button id="save_btn">Save to Watch</button>

  </div>

  <script>
    function getQueryParam(variable, defaultValue) {
      var query = location.search.substring(1);
      var vars = query.split('&');
      for (var i = 0; i < vars.length; i++) {
        var pair = vars[i].split('=');
        if (pair[0] === variable) {
          return decodeURIComponent(pair[1]);
        }
      }
      return defaultValue;
    }

    document.getElementById('ip').value = getQueryParam('ip', '192.168.1.50');
    document.getElementById('port').value = getQueryParam('port', '3000');
    document.getElementById('font_size').value = getQueryParam('font_size', '1');
    document.getElementById('scroll_text').value = getQueryParam('scroll_text', '0');
    document.getElementById('updown_vol').value = getQueryParam('updown_vol', '0');
    document.getElementById('timeout_app').value = getQueryParam('timeout_app', '0');
    document.getElementById('timeout_disc').value = getQueryParam('timeout_disc', '0');

    if (getQueryParam('support_updown') === '1') {
      document.getElementById('updown_card').style.display = 'block';
    }

    document.getElementById('save_btn').addEventListener('click', function() {
      var config = {
        ip: document.getElementById('ip').value,
        port: document.getElementById('port').value,
        font_size: document.getElementById('font_size').value,
        scroll_text: document.getElementById('scroll_text').value,
        updown_vol: document.getElementById('updown_vol').value,
        timeout_app: document.getElementById('timeout_app').value,
        timeout_disc: document.getElementById('timeout_disc').value
      };

      var return_to = getQueryParam('return_to', 'pebblejs://close#');
      window.location.href = return_to + encodeURIComponent(JSON.stringify(config));
    });
  </script>

</body>
</html>
