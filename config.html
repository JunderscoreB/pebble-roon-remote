<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roon Bridge Settings</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #222; color: #eee; }
    label { display: block; margin-bottom: 10px; font-weight: bold; }
    .warning { font-size: 12px; color: #ff9800; font-weight: normal; margin-left: 5px; }
    input, select { width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 5px; border: none; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; padding: 15px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-bottom: 10px; font-weight: bold; }
    .btn-save { background: #ff5722; color: white; }
  </style>
</head>
<body>
  <h2>Roon Bridge Settings</h2>
  
  <label for="ip">Extension IP Address</label>
  <input type="text" id="ip" placeholder="192.168.1.50" />
  
  <label for="port">Port</label>
  <input type="text" id="port" placeholder="3000" value="3000" />

  <label for="font-size">Font Size</label>
  <select id="font-size">
    <option value="0">Small</option>
    <option value="1">Normal</option>
    <option value="2">Large</option>
  </select>

  <label for="scroll-text">Auto-Scroll Long Text <span class="warning">(Heavy Battery Drain)</span></label>
  <select id="scroll-text">
    <option value="0">Off (Battery Saver)</option>
    <option value="1">On (Marquee Scroll)</option>
  </select>
  
  <button class="btn-save" onclick="save()">Save to Watch</button>

  <script>
    function getQueryParam(h) {
      var result = new RegExp('[?&]' + h + '=([^&#]*)').exec(window.location.href);
      return result && decodeURIComponent(result[1]) || '';
    }
    
    document.getElementById('ip').value = getQueryParam('ip') || '';
    document.getElementById('port').value = getQueryParam('port') || '3000';
    document.getElementById('font-size').value = getQueryParam('font_size') || '1';
    document.getElementById('scroll-text').value = getQueryParam('scroll_text') || '0';

    function save() {
      var config = { 
        "ip": document.getElementById('ip').value, 
        "port": document.getElementById('port').value,
        "font_size": document.getElementById('font-size').value,
        "scroll_text": document.getElementById('scroll-text').value
      };
      var return_to = getQueryParam('return_to') || 'pebblejs://close#';
      location.href = return_to + encodeURIComponent(JSON.stringify(config));
    }
  </script>
</body>
</html>
